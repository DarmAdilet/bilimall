  <style>
    body {
      font-family: sans-serif;
      background-color: white;
      padding: 40px;
      margin: 0;
    }

    .books-row {
  display: grid;
  grid-template-columns: repeat(5, 220px); /* 5 колонок по 220px */
  gap: 50px;
  justify-content: center;
}



.books-row img {
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 0 12px rgba(0,0,0,0.15);
}

    .books-row a {
  display: inline-block;
  margin-top: 12px;
  background-color: blue;
  color: white;
  text-align: center;
  text-decoration: none;
  padding: 10px 20px; 
  border-radius: 24px;
  font-weight: bold;
  font-size: 16px; 
   /* Добавляем смещение */
   margin-left: auto;
  margin-right: auto;
  display: block;
  width: 70%; /* Или сколько нужно */
    
    .book-container {
      width: 250px;
      text-align: center;
    }

    .books-row a:hover {
      background-color: darkblue;
    }
    }
  </style>
</head>
