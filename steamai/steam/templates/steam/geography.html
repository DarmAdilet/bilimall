<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кітаптар-География</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: sans-serif;
      background-color: white;
      padding: 40px;
      margin: 0;
    }

    .books-row {
  display: grid;
  grid-template-columns: repeat(5, 220px); /* 5 колонок по 220px */
  gap: 50px;
  justify-content: center;
}



.books-row img {
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 0 12px rgba(0,0,0,0.15);
}

    .books-row a {
  display: inline-block;
  margin-top: 12px;
  background-color: blue;
  color: white;
  text-align: center;
  text-decoration: none;
  padding: 10px 20px; 
  border-radius: 24px;
  font-weight: bold;
  font-size: 16px; 
   /* Добавляем смещение */
   margin-left: auto;
  margin-right: auto;
  display: block;
  width: 70%; /* Или сколько нужно */
    
    .book-container {
      width: 250px;
      text-align: center;
    }

    .books-row a:hover {
      background-color: darkblue;
    }
    }
  </style>
</head>
<body>
   <div class="container">
        <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
      <div class="col-md-3 mb-2 mb-md-0">
       <h5 class="my-0 mr-md-auto font-weight-normal">BilimAll</h5>
      </div>

      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="{% url 'index' %}" class="nav-link px-2 ">Басты бет</a></li>
      </ul>

        </header>
     </div>
  <div class="books-row">
    <!-- Книга 1 -->
    <div class="book-container">
      <img src="https://okulyk.kz/wp-content/books/243/243.jpg" alt="География 7">
      <a href="https://s3.timeweb.cloud/29ae0e9e-okulyk-books/243/243.pdf" target="_blank">Кітапты ашу</a>
    </div>

    <!-- Книга 2 -->

    </div>

    <!-- Книга 3 -->

    <!-- Книга 4 -->
